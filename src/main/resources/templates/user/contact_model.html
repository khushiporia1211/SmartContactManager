<div data-th-fragment="contact">

    <div id="view_contact_model" tabindex="-1" aria-hidden="true"
        class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
        <div class="relative p-4 w-full max-w-5xl max-h-[calc(100vh-2rem)]">
            <div class="relative bg-white border border-default rounded-base shadow-sm p-4 md:p-6 max-h-[85vh] flex flex-col">
                <div class="flex items-center justify-between border-b border-default pb-4 md:pb-5">
                    <div>
                        <h3 id="contact_name" class="text-lg font-medium text-heading"></h3>
                        <p id="contact_email" class="text-gray-800"></p>
                    </div>
                    <button onclick="closeContactModel()" type="button"
                        class="text-body bg-white hover:bg-neutral-tertiary hover:text-heading rounded-base text-sm w-9 h-9 ms-auto inline-flex justify-center items-center"
                        aria-label="Close contact details">
                        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                            fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18 17.94 6M18 18 6.06 6" />
                        </svg>
                    </button>
                </div>
                <div class="min-h-0 flex-1 overflow-y-auto py-4 md:py-6">
                    <table class="w-full text-sm text-left text-gray-700">
                        <caption class="sr-only">Contact details</caption>
                        <tbody class="divide-y divide-gray-200">
                            <tr><th scope="row" class="w-1/3 px-4 py-3 font-medium text-gray-900">ID</th><td id="contact_id" class="px-4 py-3 break-all"></td></tr>
                            <tr><th scope="row" class="px-4 py-3 font-medium text-gray-900">Name</th><td id="contact_name_value" class="px-4 py-3"></td></tr>
                            <tr><th scope="row" class="px-4 py-3 font-medium text-gray-900">Email</th><td id="contact_email_value" class="px-4 py-3 break-all"></td></tr>
                            <tr><th scope="row" class="px-4 py-3 font-medium text-gray-900">Phone</th><td id="contact_phoneNumber" class="px-4 py-3"></td></tr>
                            <tr><th scope="row" class="px-4 py-3 font-medium text-gray-900">Address</th><td id="contact_address" class="px-4 py-3 whitespace-pre-wrap"></td></tr>
                            <tr>
                                <th scope="row" class="px-4 py-3 font-medium text-gray-900">Picture</th>
                                <td class="px-4 py-3 break-all">
                                    <img id="contact_picture_image" class="hidden mb-2 h-20 w-20 rounded object-cover" alt="Contact picture">
                                    <span id="contact_picture"></span>
                                </td>
                            </tr>
                            <tr><th scope="row" class="px-4 py-3 font-medium text-gray-900">Description</th><td id="contact_description" class="px-4 py-3 whitespace-pre-wrap"></td></tr>
                            <tr><th scope="row" class="px-4 py-3 font-medium text-gray-900">Favourite</th><td id="contact_favourite" class="px-4 py-3"></td></tr>
                            <tr><th scope="row" class="px-4 py-3 font-medium text-gray-900">Website</th><td id="contact_websiteLink" class="px-4 py-3 break-all"></td></tr>
                            <tr><th scope="row" class="px-4 py-3 font-medium text-gray-900">LinkedIn</th><td id="contact_linkedInLink" class="px-4 py-3 break-all"></td></tr>
                            <tr><th scope="row" class="px-4 py-3 font-medium text-gray-900">Cloudinary image public ID</th><td id="contact_cloundinaryImagePublicId" class="px-4 py-3 break-all"></td></tr>
                            <tr><th scope="row" class="px-4 py-3 font-medium text-gray-900">Other links</th><td id="contact_links" class="px-4 py-3"></td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="flex justify-end border-t border-default pt-4 md:pt-5">
                    <button onclick="closeContactModel()" type="button"
                        class="text-body bg-white box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading focus:ring-4 focus:ring-neutral-tertiary shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

</div>
