<!DOCTYPE html>
<html lang="en" th:replace="~{base::parent(~{::#content},~{::title},~{::script})}">

<head>
    <title>All Yours Contacts</title>
</head>

<body>
    <div id="content">
        <!-- //sidebar -->

        <div th:if="${loggedInUser}">
            <div data-th-replace="~{user/sidebar::sidebar}"></div>
        </div>

        <div class="sm:pl-64 pt-20">
            <div class="">

                <h1 class="text-5xl text-center">List of Contacts</h1>
                <p class="text-center">Lorem ipsum dolor,icitatum provident sapiente ex maxime odio, a amet repellendus
                    inventore?</p>

                <div class="contact_container p-5">


                    <div class="relative bg-white  overflow-x-autoshadow-xs rounded-base border border-default">

                        <form data-th-action="@{'/user/contacts/search'}">

                            <div
                                class="flex space-x-3 p-5 items-center justify-start flex-column flex-wrap md:flex-row space-y-4 md:space-y-0 p-4">


                                <!-- Select box -->

                                <div class="w-48">
                                    <select 
                                        name="field"
                                        id="countries_disabled"
                                        class="block w-full bg-gray-50 border border-gray-300text-heading text-sm rounded-base focus:ring-brand focus:border-brand px-3 py-2.5 shadow-xs text-fg-enabled">
                                        <option selected>Select Field </option>
                                        <option value="name">Name</option>
                                        <option value="phone">Phone</option>
                                        <option value="email">Email</option>

                                    </select>
                                </div>

                                <label for="input-group-1" class="sr-only">Search</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                                        <svg class="w-4 h-4 text-body" aria-hidden="true"
                                            xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
                                            viewBox="0 0 24 24">
                                            <path stroke="currentColor" stroke-linecap="round" stroke-width="2"
                                                d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
                                        </svg>
                                    </div>
                                    <input 
                                        name="keyword"
                                        type="text" id="input-group-1"
                                        class="block w-full max-w-96 ps-9 pe-3 py-2  border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
                                        placeholder="Search">
                                </div>
                                <button type="submit" class="px-3 py-2 bg-gray-800 text-white rounded">Search</button>
                            </div>
                        </form>

                        <table class="w-full text-sm text-left rtl:text-right text-body">
                            <thead class="text-sm text-body  border-b border-t border-default-medium">
                                <tr>

                                    <th scope="col" class="px-6 py-3 font-medium">
                                        Name
                                    </th>
                                    <th scope="col" class="px-6 py-3 font-medium">
                                        Phone
                                    </th>
                                    <th scope="col" class="px-6 py-3 font-medium">
                                        Links
                                    </th>
                                    <th scope="col" class="px-6 py-3 font-medium">
                                        Action
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr data-th-object="${c}" data-th-each="c : ${contacts.content}"
                                    class=" border-b border-default hover:bg-neutral-secondary-medium">

                                    <th scope="row" class="flex items-center px-6 py-4 text-heading whitespace-nowrap">
                                        <img onerror="this.src='https://media.istockphoto.com/id/2221915585/vector/grey-avatar-icon-user-avatar-photo-icon-social-media-user-icon-vector.jpg?s=612x612&w=0&k=20&c=9CObBqL8r65oVfHE4hyEqpyb8FwK7VfDqF1qXD5YMz4='"
                                            class="w-10 h-10 rounded-full" data-th-src="@{*{picture}}" alt="Jese image">
                                        <div class="ps-3">
                                            <div class="text-base font-semibold" data-th-text="*{name}">Neil Sims</div>
                                            <div class="font-normal text-body" data-th-text="*{email}">
                                                neil.sims@flowbite.com</div>
                                        </div>
                                    </th>
                                    <td class="px-6 py-4">
                                        <i class="fa-solid fa-phone w-4 h-4"></i>
                                        <span data-th-text="*{phoneNumber}"></span>

                                    </td>
                                    <td class="px-6 py-4">
                                        <div class="flex items-center">
                                            <div data-th-if="*{favourite}"
                                                class="h-2.5 w-2.5 rounded-full bg-green-500 me-2"></div>

                                            <a data-th-href="@{*{websiteLink}}" target="_blank">
                                                <i class="w-6 h-6 fa-solid fa-link"></i>
                                            </a>


                                            <a data-th-href="@{*{linkedInLink}}" target="_blank">
                                                <i class="w-6 h-6 fa-brands fa-linkedin"></i>
                                            </a>

                                        </div>
                                    </td>
                                    <td>
                                        <div>
                                            <a class="p-2 ">
                                                <i class="w-6 h-6 fa-solid fa-trash"></i>
                                            </a>

                                            <a class="p-2 ">
                                                <i class="w-6 h-6 fa-solid fa-pen"></i>
                                            </a>

                                            <a class="p-2 ">
                                                <i class="w-6 h-6 fa-regular fa-eye"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>

                            </tbody>
                        </table>
                        <!-- //pagination component -->
                        <div class="pagination_container p-5 flex items-center justify-center">
                            <nav aria-label="Page navigation example">
                                <ul class="flex -space-x-px text-sm">
                                    <li data-th-unless="${contacts.first}">
                                        <a data-th-href="@{'/user/contacts?size='+${pageSize}+'&page='+${contacts.number-1}}"
                                            class="flex items-center justify-center text-body bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading font-medium rounded-s-base text-sm px-3 h-10 focus:outline-none">Previous</a>
                                    </li>
                                    <li data-th-each="index : ${#numbers.sequence(0,contacts.totalPages-1)}">

                                        <a data-th-classappend="${index == contacts.number} ? 'bg-blue-100 text-heading' : ''"
                                            data-th-href="@{'/user/contacts?size='+${pageSize}+'&page=' + ${index}}"
                                            class="flex items-center justify-center text-body bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading font-medium text-sm w-10 h-10 focus:outline-none">
                                            <span data-th-text="${index + 1}"></span>
                                        </a>

                                    </li>

                                    <li data-th-unless="${contacts.last}">
                                        <a data-th-href="@{'/user/contacts?size='+${pageSize}+'&page='+${contacts.number+1}}"
                                            class="flex items-center justify-center text-body bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading font-medium rounded-e-base text-sm px-3 h-10 focus:outline-none">Next</a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>
    <script>
        console.log("this is a dashboard page")
    </script>
</body>

</html>
