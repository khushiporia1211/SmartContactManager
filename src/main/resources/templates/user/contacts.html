<!DOCTYPE html>
<html lang="en" th:replace="~{base::parent(~{::#content},~{::title},~{::script})}">

<head>
    <title>All Yours Contacts</title>
</head>

<body>
    <div id="content">
        <!-- //sidebar -->

        <div th:if="${loggedInUser}">
            <div data-th-replace="~{user/sidebar::sidebar}"></div>
        </div>

        <div class="sm:pl-64 pt-20">
            <div class="">

                <h1 class="text-5xl text-center">List of Contacts</h1>
                <p class="text-center">Lorem ipsum dolor,icitatum provident sapiente ex maxime odio, a amet repellendus inventore?</p>

                <div class="contact_container p-5">


                    <div
                        class="relative bg-white  overflow-x-autoshadow-xs rounded-base border border-default">
                        <div
                            class="flex p-5 items-center justify-between flex-column flex-wrap md:flex-row space-y-4 md:space-y-0 p-4">
                            <div>
                                <button id="dropdownDefaultButton" data-dropdown-toggle="dropdown"
                                    class="inline-flex items-center justify-center text-body box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading focus:ring-4 focus:ring-neutral-tertiary shadow-xs font-medium leading-5 rounded-base text-sm px-3 py-2 focus:outline-none"
                                    type="button">
                                    Action
                                    <svg class="w-4 h-4 ms-1.5 -me-0.5" aria-hidden="true"
                                        xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
                                        viewBox="0 0 24 24">
                                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                            stroke-width="2" d="m19 9-7 7-7-7" />
                                    </svg>
                                </button>
                                <!-- Dropdown menu -->
                                <div id="dropdown"
                                    class="z-10 hidden border border-default-medium rounded-base shadow-lg w-32">
                                    <ul class="p-2 text-sm text-body font-medium"
                                        aria-labelledby="dropdownDefaultButton">
                                        <li>
                                            <a href="#"
                                                class="inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded">Reward</a>
                                        </li>
                                        <li>
                                            <a href="#"
                                                class="inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded">Promote</a>
                                        </li>
                                        <li>
                                            <a href="#"
                                                class="inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded">Archive</a>
                                        </li>
                                        <li>
                                            <a href="#"
                                                class="inline-flex items-center w-full p-2 text-fg-danger hover:bg-neutral-tertiary-medium rounded">Delete</a>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                            <label for="input-group-1" class="sr-only">Search</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                                    <svg class="w-4 h-4 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                        width="24" height="24" fill="none" viewBox="0 0 24 24">
                                        <path stroke="currentColor" stroke-linecap="round" stroke-width="2"
                                            d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
                                    </svg>
                                </div>
                                <input type="text" id="input-group-1"
                                    class="block w-full max-w-96 ps-9 pe-3 py-2  border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
                                    placeholder="Search">
                            </div>
                        </div>
                        <table class="w-full text-sm text-left rtl:text-right text-body">
                            <thead
                                class="text-sm text-body  border-b border-t border-default-medium">
                                <tr>
                                    
                                    <th scope="col" class="px-6 py-3 font-medium">
                                        Name
                                    </th>
                                    <th scope="col" class="px-6 py-3 font-medium">
                                        Phone
                                    </th>
                                    <th scope="col" class="px-6 py-3 font-medium">
                                        Links
                                    </th>
                                    <th scope="col" class="px-6 py-3 font-medium">
                                        Action
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr
                                    data-th-object="${c}"
                                    data-th-each="c : ${contacts.content}"
                                    class=" border-b border-default hover:bg-neutral-secondary-medium">
                                    
                                    <th scope="row" class="flex items-center px-6 py-4 text-heading whitespace-nowrap">
                                        <img 
                                        onerror="this.src='https://media.istockphoto.com/id/2221915585/vector/grey-avatar-icon-user-avatar-photo-icon-social-media-user-icon-vector.jpg?s=612x612&w=0&k=20&c=9CObBqL8r65oVfHE4hyEqpyb8FwK7VfDqF1qXD5YMz4='"
                                        class="w-10 h-10 rounded-full"
                                            data-th-src="@{*{picture}}" alt="Jese image">
                                        <div class="ps-3">
                                            <div class="text-base font-semibold" data-th-text="*{name}">Neil Sims</div>
                                            <div class="font-normal text-body" data-th-text="*{email}">neil.sims@flowbite.com</div>
                                        </div>
                                    </th>
                                    <td class="px-6 py-4">
                                        <i class="fa-solid fa-phone w-4 h-4"></i>
                                        <span  data-th-text="*{phoneNumber}"></span>
                                        
                                    </td>
                                    <td class="px-6 py-4">
                                        <div class="flex items-center">
                                            <div 
                                                data-th-if="*{favourite}"
                                                class="h-2.5 w-2.5 rounded-full bg-green-500 me-2"></div> 
                                            
                                            <a data-th-href="@{*{websiteLink}}" 
                                                target="_blank">
                                                <i class="w-6 h-6 fa-solid fa-link"></i>
                                            </a>
                                        
                                            
                                            <a data-th-href="@{*{linkedInLink}}" 
                                                target="_blank">
                                                <i class="w-6 h-6 fa-brands fa-linkedin"></i>
                                            </a>
                                        
                                        </div>
                                    </td>
                                    <td>
                                    <div>
                                        <a class="p-2 ">
                                             <i class="w-6 h-6 fa-solid fa-trash"></i>
                                        </a>
                                       
                                        <a class="p-2 ">
                                            <i class="w-6 h-6 fa-solid fa-pen"></i>
                                        </a>
                                        
                                        <a class="p-2 ">
                                            <i class="w-6 h-6 fa-regular fa-eye"></i>
                                        </a>
                                    </div>
                                    </td>
                                </tr>
                                
                            </tbody>
                        </table>
                    </div>

                </div>

            </div>
        </div>
    </div>
    <script>
        console.log("this is a dashboard page")
    </script>
</body>

</html>
