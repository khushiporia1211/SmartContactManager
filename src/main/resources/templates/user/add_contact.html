<!DOCTYPE html>
<html lang="en" th:replace="~{base::parent(~{::#content},~{::title},~{::#pageScripts})}">

<head>
    <title>Add Contact</title>
</head>

<body>
    <div id="content">
        <!-- //sidebar -->

        <div th:if="${loggedInUser}">
            <div data-th-replace="~{user/sidebar::sidebar}"></div>
        </div>

        <div class="sm:pl-64 pt-20" style="height: 1000px">
            <div class="grid grid-cols-12">
                <div class="col-span-3 "></div>
                <div class="sm:col-span-12 md:col-span-6">
                    <div
                        class=" card bg-white block p-6 border border-gray-300 rounded-lg shadow-xs hover:bg-neutral-secondary-medium">
                        
                        <div data-th-replace="~{message::messagebox}"></div>
                        
                        <h1 class="text-3xl font-semibold">Add New Contact</h1>
                        <p class="text-grey-500">This contact will be stored on cloud , you can direct email this client
                            from scm</p>
                            
                            <form data-th-action="@{'/user/contacts/add'}" 
                                    class="mt-8"
                                    method="post"
                                    data-th-object="${contactForm}"
                                    enctype="multipart/form-data">
                              
                                    <!-- // Name of the contact -->

                                <div class="mb-3">
                                <label for="input-group-1" class="block mb-2.5 text-sm font-medium text-heading">Contact Name</label>
                       <div class="relative mb-1">
                            <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                                <i class="fa-regular fa-user w-4 h-4"></i>
                            </div>
                            <input data-th-field="*{name}"
                            type="text" 
                                class="block w-full ps-9 pe-3 py-2.5 bg-neutral-secondary-medium rounded-lg  border border-gray-300  text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
                                placeholder="name">
                                
                        </div>
                        <p data-th-if="${#fields.hasErrors('name')}"
                            data-th-errors="*{name}"
                            class="text-red-500"></p>
                            </div>

                            <!-- email -->
                            <div class="mb-3">
                                <label for="input-group-1" class="block mb-2.5 text-sm font-medium text-heading">Email</label>
                       <div class="relative" mb-1>
                            <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                                <i class="fa-regular fa-envelope w-4 h-4"></i>
                            </div>
                            <input data-th-field="*{email}"
                                    type="text" 
                                class="block w-full ps-9 pe-3 py-2.5 bg-neutral-secondary-medium rounded-lg  border border-gray-300  text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
                                placeholder="john@gmail.com">
                        </div>
                        <p data-th-if="${#fields.hasErrors('email')}"
                            data-th-errors="*{email}"
                            class="text-red-500"></p>
                            </div>
                            <!-- phone number -->
                            <div class="mb-3">
                                <label for="input-group-1" class="block mb-2.5 text-sm font-medium text-heading">Contact Number</label>
                       <div class="relative">
                            <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                                <i class="fa-solid fa-phone-flip w-4 h-4"></i>
                            </div>
                            <input  data-th-field="*{phoneNumber}"
                            type="text" 
                                class="block w-full ps-9 pe-3 py-2.5 bg-neutral-secondary-medium rounded-lg  border border-gray-300  text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
                                placeholder="9876XXXXXX">
                        </div>
                        <p data-th-if="${#fields.hasErrors('phoneNumber')}"
                            data-th-errors="*{phoneNumber}"
                            class="text-red-500"></p>
                            </div>

                            <!-- Address  -->
                             <div class="mb-3">
                                
                                <label for="message" class="block mb-2.5 text-sm font-medium text-heading">Contact Address</label>
                                <textarea data-th-field="*{address}" id="message" rows="4" class="bg-neutral-secondary-medium border border-gray-300 rounded-lg   text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full p-3.5 shadow-xs placeholder:text-body" placeholder="Address of the contact"></textarea>

                             </div>
                             <!-- Description about the contact -->
                               <div class="mb-3">
                                
                                <label for="message" class="block mb-2.5 text-sm font-medium text-heading">Contact Description</label>
                                <textarea data-th-field="*{description}" rows="4" class="bg-neutral-secondary-medium border border-gray-300 rounded-lg  text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full p-3.5 shadow-xs placeholder:text-body" placeholder="Write about your contact"></textarea>

                             </div>

                             <!-- social links -->
                              <div class="flex space-x-3 mb-4" >
                                <!-- website  link -->
                                <div class="w-full">
                                    <div class="mb-3">
                       <div class="relative">
                            <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                              <i class="fa-solid fa-earth-americas w-4 h-4"></i>
                            </div>
                            <input data-th-field="*{websiteLink}" type="text" id="input-group-1"
                                class="block w-full ps-9 pe-3 py-2.5 bg-neutral-secondary-medium border border-gray-300 rounded-lg  text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
                                placeholder="https://www.facebook.com/username">
                        </div>
                            </div>
                                </div>
                                    <!-- Linkdin link -->
                                <div class="w-full">
                                    <div class="mb-3">
                       <div class="relative">
                            <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                             <i class="fa-brands fa-linkedin h-5 w-5"></i>
                            </div>
                            <input data-th-field="*{linkedInLink}" type="text" id="input-group-1"
                                class="block w-full ps-9 pe-3 py-2.5 bg-neutral-secondary-medium border border-gray-300 rounded-lg   text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
                                placeholder="https://www.linkedin.com/in/username">
                        </div>
                            </div>
                                </div>
                              </div>
                                <!-- profile picture -->
                                <div class="mb-2">
                                    <label class="block mb-2.5 text-sm font-medium text-heading" for="small_size">Contact Image</label>
                                    <input data-th-field="*{contactImage}" 
                                    class="cursor-pointer bg-neutral-secondary-medium border border-gray-300 rounded-lg   text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full shadow-xs placeholder:text-body" 
                                    id="image_file_input" 
                                    type="file">
                                    <img class="max-h-52 mx-auto rounded-lg shadow m-3" src="" id="upload_image_preview" alt="">
                                    
                                    <p data-th-if="${#fields.hasErrors('contactImage')}"
                            data-th-errors="*{contactImage}"
                            class="text-red-500"></p>
                                </div>

                                <!-- //favourite checkbox -->
                                <div class="flex items-center mb-3">
                                    <input data-th-field="*{favourite}" id="default-checkbox" type="checkbox" value="" class="w-4 h-4 border border-gray-300 rounded-lg  bg-neutral-secondary-medium focus:ring-2 focus:ring-brand-soft">
                                    <label for="default-checkbox" class="select-none ms-2 text-sm font-medium text-heading">Is this your favourite contact?</label>
                                </div>
                              
                                    <div class="button-container text-center">
                                        <button type="submit" class="px-3 py-2 rounded bg-black text-white">Add Contact</button>
                                        <button type="reset" class="px-3 py-2 rounded bg-black text-white">Reset</button>
                                    </div>
                                
                               
                            </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <th:block id="pageScripts">
        <script data-th-src="@{/js/admin.js}"></script>
        <script>
            console.log("this is a contact page")
        </script>
    </th:block>
</body>

</html>
